[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "demander-universal"
version = "0.3.0a0"
description = "Independent, evidence-backed software verification via DPC-1"
requires-python = ">=3.11"
[project.scripts]
demander = "demander.cli:main"
[tool.setuptools.packages.find]
include = ["demander*"]
